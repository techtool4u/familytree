rinary residency`],[`s_doyle`,1994,M,`Dublin, Ireland`,`Returned to the old country to play music`],[`c_rossi`,1962,j,`Rome, Italy`,`Opened a trattoria in Trastevere`]],oe=[[`g_rossi`,1940,`military`,`Conscripted into the Regia Marina`,j],[`p_obrien`,1943,`military`,`Served with the US Army in Europe`,`London, England`],[`f_doyle`,1957,`military`,`US Navy, stationed in Norfolk`],[`a_rossi`,1964,`career`,`Opened Rossi & Sons Carpentry`,M],[`c_henry`,1961,`career`,`Opened the Golden Gate Noodle House`,N],[`m_obrien2`,1960,`career`,`Began teaching 3rd grade in Dorchester`,M],[`d_rossi`,1986,`education`,`Graduated from MIT School of Architecture`,M],[`g_chen`,1992,`education`,`MD, UCSF School of Medicine`,N],[`maya`,2017,`education`,`BFA, Rhode Island School of Design`],[`maya`,2022,`residence`,`Bought first home in Jamaica Plain`,M],[`leo`,2021,`career`,`Joined the Woods Hole research fleet`],[`b_murphy`,1944,`career`,`Head nurse, Boston City Hospital`,M],[`c_wei`,1925,`career`,`Founded a tea trading house`,ee],[`c_xia`,2014,`career`,`Shipped her first indie game`],[`ar_chen`,2018,`career`,`Joined a Mars rover team`]],se={maya:`Designer, gardener and the keeper of this family tree. Started collecting stories from Grandma Lily in 2019 and never stopped.`,a_rossi:`Antonio arrived in Boston in 1956 with a single suitcase and his father’s carpenter’s plane. He built half the porches in the North End and sang Neapolitan songs while he worked.`,m_obrien2:`Margaret taught third grade for 38 years. Former students still send Christmas cards. She met Antonio at a dance in 1958 — he couldn’t dance, she taught him.`,c_henry:`Henry opened the Golden Gate Noodle House in 1961. It ran for 40 years and fed three generations of the neighborhood.`,w_lily:`Lily came to San Francisco to study pharmacy and ran the family pharmacy until 2001. At 89 she still does the crossword in ink.`,p_obrien:`Patrick left Cork at 19. He walked the beat in South Boston and served in Europe during WWII.`,t_murphy:`Thomas worked the Boston docks for 40 years. Family legend says he once arm-wrestled a Red Sox pitcher.`,g_rossi:`Giuseppe fished the Bay of Naples his whole life, except for the war years in the navy.`,f_rossi:`The earliest Rossi we can document. Appears in the 1871 parish records of Santa Lucia.`},ce=[[`a_rossi`,`document`,`Ship manifest — SS Cristoforo Colombo`,1956,`Line 14: ROSSI, Antonio, 21, carpenter`],[`a_rossi`,`photo`,`Wedding day at St. Leonard’s`,1959],[`m_obrien2`,`photo`,`Class photo, Dorchester Elementary`,1972],[`t_murphy`,`document`,`Naturalization certificate`,1912],[`p_obrien`,`document`,`WWII discharge papers`,1945],[`c_henry`,`photo`,`Golden Gate Noodle House opening`,1961],[`w_lily`,`story`,`Recorded interview: “Crossing the Pacific”`,2019,`42-minute audio transcript`],[`f_rossi`,`document`,`Parish baptism record`,1845],[`maya`,`photo`,`Noah’s first birthday`,2024],[`g_rossi`,`photo`,`On the boat, Bay of Naples`,1938]],le=`maya`,ue=[{id:`cap-antonio`,toId:`maya`,fromId:`a_rossi`,fromName:`Antonio Rossi`,title:`For my Maya, when you are all grown up`,message:`Cara Maya,

When I came to Boston I had one suitcase and my father’s carpenter’s plane. The plane is in the blue toolbox in your father’s garage — it is yours now. Use it to build something with your hands, even something small.
