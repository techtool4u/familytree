ed the Boston docks for 40 years. Family legend says he once arm-wrestled a Red Sox pitcher.`,g_rossi:`Giuseppe fished the Bay of Naples his whole life, except for the war years in the navy.`,f_rossi:`The earliest Rossi we can document. Appears in the 1871 parish records of Santa Lucia.`},se=[[`a_rossi`,`document`,`Ship manifest — SS Cristoforo Colombo`,1956,`Line 14: ROSSI, Antonio, 21, carpenter`],[`a_rossi`,`photo`,`Wedding day at St. Leonard’s`,1959],[`m_obrien2`,`photo`,`Class photo, Dorchester Elementary`,1972],[`t_murphy`,`document`,`Naturalization certificate`,1912],[`p_obrien`,`document`,`WWII discharge papers`,1945],[`c_henry`,`photo`,`Golden Gate Noodle House opening`,1961],[`w_lily`,`story`,`Recorded interview: “Crossing the Pacific”`,2019,`42-minute audio transcript`],[`f_rossi`,`document`,`Parish baptism record`,1845],[`maya`,`photo`,`Noah’s first birthday`,2024],[`g_rossi`,`photo`,`On the boat, Bay of Naples`,1938]],ce=`maya`,le=[{id:`cap-antonio`,toId:`maya`,fromId:`a_rossi`,fromName:`Antonio Rossi`,title:`For my Maya, when you are all grown up`,message:`Cara Maya,

When I came to Boston I had one suitcase and my father’s carpenter’s plane. The plane is in the blue toolbox in your father’s garage — it is yours now. Use it to build something with your hands, even something small.
