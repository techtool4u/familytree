name: Mobile apps

# Builds the Android app (installable test APK) and checks the iOS app compiles.
# Store-ready signed builds need your Google Play / Apple developer keys (see MOBILE.md).
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # to publish the APK on the "Latest Android build" release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build web app and copy into Android project
        run: npm run cap:sync
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: OurFamilyTree-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish APK to the "Latest Android build" release (main only)
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk OurFamilyTree.apk
          NOTES="Test build of the OurFamilyTree Android app, updated on every change to main (latest: ${GITHUB_SHA::7}). On your Android phone, download OurFamilyTree.apk and open it (allow installing from this source when asked)."
          gh release view android-latest >/dev/null 2>&1 || gh release create android-latest --prerelease --title "Latest Android build" --notes "$NOTES"
          gh release upload android-latest OurFamilyTree.apk --clobber
          gh release edit android-latest --notes "$NOTES"

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build web app and copy into iOS project
        run: npm run cap:sync
      - name: Build for iOS Simulator (unsigned)
        run: >
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build
